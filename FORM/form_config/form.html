<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phiếu nhập thông tin</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            margin-top: 20px;
            font-family: "Times New Roman", serif;
            font-size: 18px;
            background: white;
        }

        form {
            width: 850px;
            padding: 0;
            border: none;
        }

        fieldset {
            border: 1px solid #aaa;
            padding: 5px 15px 15px;
        }

        legend {
            font-weight: bold;
            padding: 0 5px;
        }

        .group {
            display: flex;
            align-items: center;
            margin-bottom: 3px;
        }

        .group>label {
            width: 120px;
            flex-shrink: 0;
        }

        input[type="text"] {
            width: 240px;
            height: 26px;
            font-family: inherit;
            font-size: 17px;
            padding: 2px 4px;
        }

        .radio-options,
        .checkbox-options {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .radio-options label,
        .checkbox-options label {
            display: inline-flex;
            align-items: center;
            white-space: nowrap;
        }

        select {
            width: 225px;
            height: 25px;
            font-family: inherit;
            font-size: 17px;
        }

        textarea {
            width: 537px;
            height: 100px;
            font-family: monospace;
            font-size: 16px;
            padding: 4px;
        }

        .buttons {
            margin-left: 120px;
            margin-top: 3px;
        }

        input[type="submit"],
        input[type="reset"] {
            font-family: inherit;
            font-size: 16px;
            padding: 1px 10px;
            margin-right: 8px;
        }
    </style>
</head>

<body>

    <form action="config.php" method="post">

        <fieldset>
            <legend>Enter Your Information</legend>

            <div class="group">
                <label for="fullname">Fullname</label>
                <input type="text" name="fullname" id="fullname" value="">
            </div>

            <div class="group">
                <label for="address">Address</label>
                <input type="text" name="address" id="address" value="">
            </div>

            <div class="group">
                <label for="phone">Phone</label>
                <input type="text" name="phone" id="phone" value="">
            </div>

            <div class="group">
                <label>Gender</label>

                <div class="radio-options">
                    <label>
                        <input type="radio" name="gender" value="nam" checked>
                        Nam
                    </label>

                    <label>
                        <input type="radio" name="gender" value="nu">
                        Nữ
                    </label>
                </div>
            </div>

            <div class="group">
                <label for="country">Country</label>

                <select name="country" id="country">
                    <option value="VietNam">Việt Nam</option>
                    <option value="USA">USA</option>
                    <option value="Japan">Japan</option>
                    <option value="Korea">Korea</option>
                </select>
            </div>

            <div class="group">
                <label>Study</label>

                <div class="checkbox-options">
                    <label>
                        <input type="checkbox" name="study[]" value="PHP & MySQL">
                        PHP & MySQL
                    </label>

                    <label>
                        <input type="checkbox" name="study[]" value="ASP.NET">
                        ASP.NET
                    </label>

                    <label>
                        <input type="checkbox" name="study[]" value="CCNA">
                        CCNA
                    </label>

                    <label>
                        <input type="checkbox" name="study[]" value="Security+">
                        Security+
                    </label>
                </div>
            </div>

            <div class="group note-group">
                <label for="note">Note</label>
                <textarea name="note" id="note"></textarea>
            </div>

            <div class="buttons">
                <input type="submit" value="Gửi">
                <input type="reset" value="Hủy">
            </div>

        </fieldset>

    </form>

</body>

</html>
